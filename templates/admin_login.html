<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Login Admin — D'Antar Logistik</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <a class="login-back" href="/" aria-label="Kembali ke beranda">← Kembali ke beranda</a>
    <section class="login-card" aria-labelledby="login-title">
      <a class="brand login-brand" href="/" aria-label="D'Antar Logistik">
        <span class="brand-mark" aria-hidden="true">D</span>
        <span class="brand-copy"><strong>D'ANTAR</strong><small>LOGISTIK</small></span>
      </a>
      <div class="login-heading">
        <span class="section-kicker">PORTAL OPERASIONAL</span>
        <h1 id="login-title">Selamat datang kembali.</h1>
        <p>Masuk untuk mengelola pengiriman dan data operasional.</p>
      </div>
      {% if error %}
      <div class="login-alert" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('admin_login') }}" class="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Nama pengguna</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus {% if disabled %}disabled{% endif %}>
        <label for="password">Kata sandi</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required {% if disabled %}disabled{% endif %}>
        <button class="btn login-submit" type="submit" {% if disabled %}disabled{% endif %}>Masuk ke portal <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-security"><span aria-hidden="true">◇</span> Akses khusus untuk staf D'Antar Logistik.</p>
    </section>
    <p class="login-footer">D'Antar Logistik <span>·</span> Sistem pelacakan & manajemen pengiriman</p>
  </main>
</body>
</html>

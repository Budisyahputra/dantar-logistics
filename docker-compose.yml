services:
  db:
    image: postgres:16-alpine
    container_name: dantar_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-dantar_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dantar_secret_pass}
      POSTGRES_DB: ${DB_NAME:-dantar_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dantar_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: dantar_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-dantar_admin}:${DB_PASSWORD:-dantar_secret_pass}@db:5432/${DB_NAME:-dantar_db}
    volumes:
      - ./:/app
      - pod_uploads:/app/static/uploads/pod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dantar_net

volumes:
  pgdata:
  pod_uploads:

networks:
  dantar_net:
    driver: bridge